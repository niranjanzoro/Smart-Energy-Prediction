# render.yaml – Deployment configuration for Render.com
# Deploy with: render blueprint apply

services:
  - type: web
    name: smart-energy-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /api/health
    autoDeploy: true
